<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Stamper</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>

    <div class="card">
        <h1 class="title">WEB STAMPER</h1>
        <hr class="divider">

        <div class="form-group">
            <label>Archivo a hashear (SHA-256)</label>
            <input type="file" id="fileInput" class="hidden">
            <button id="fileButton" class="btn btn-blue">Seleccionar desde archivos</button>
            <span id="fileName" class="file-name">Ningún archivo seleccionado</span>
            <div id="hashPreview" class="hash-preview hidden"></div>
        </div>

        <div class="form-group row-group">
            <label for="signCheckbox">Firmar con clave privada?</label>
            <input type="checkbox" id="signCheckbox" class="custom-checkbox">
        </div>

        <div class="form-group row-group">
            <label for="privateKey">Clave privada:</label>
            <input type="password" id="privateKey" class="input-text" disabled placeholder="• • • • • • • • • • • •">
        </div>

        <div class="action-group">
            <button id="stampButton" class="btn btn-blue btn-large" disabled>Stamp!</button>
        </div>

        <div id="resultBox" class="result-box hidden">
            <p id="resultMessage"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
